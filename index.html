<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#176b87">
    <meta name="description" content="汉字 Fun 是离线可用的中文写字练习本生成器，支持田字格、米字格、笔顺描红、笔顺分解、空白格纸、A4/A5 打印和 PDF 导出。">
    <meta name="keywords" content="汉字练习,中文写字,写字练习本,田字格,米字格,笔顺描红,笔顺练习,A4打印,PDF导出">
    <meta name="robots" content="index,follow">
    <meta name="application-name" content="汉字 Fun">
    <meta name="apple-mobile-web-app-title" content="汉字 Fun">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="汉字 Fun">
    <meta property="og:title" content="汉字 Fun - 可打印中文写字练习本生成器">
    <meta property="og:description" content="离线可用的儿童中文写字练习工具，支持笔顺描红、田字格、米字格、空白格纸、A4/A5 打印和 PDF 导出。">
    <meta property="og:url" content="https://rickytan.cn/HanZiFun/">
    <meta property="og:image" content="https://rickytan.cn/HanZiFun/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="汉字 Fun - 可打印中文写字练习本生成器">
    <meta name="twitter:description" content="离线可用的儿童中文写字练习工具，支持笔顺描红、田字格、米字格、空白格纸和 PDF 导出。">
    <meta name="twitter:image" content="https://rickytan.cn/HanZiFun/icons/icon-512.png">
    <title>汉字 Fun - 可打印中文写字练习本生成器</title>
    <link rel="canonical" href="https://rickytan.cn/HanZiFun/">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
    <style id="printPageStyle"></style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "汉字 Fun",
        "alternateName": "HanZiFun",
        "url": "https://rickytan.cn/HanZiFun/",
        "description": "离线可用的中文写字练习本生成器，支持田字格、米字格、笔顺描红、笔顺分解、空白格纸、打印和 PDF 导出。",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "image": "https://rickytan.cn/HanZiFun/icons/icon-512.png"
      }
    </script>
    <script src="vendor/jspdf.umd.min.js" defer></script>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-title">
        <img class="app-mark" src="icons/icon-192.png" width="32" height="32" alt="" aria-hidden="true">
        <strong>汉字 Fun</strong>
      </div>
      <div class="app-status" id="compactStatus">A4 · 纵向 · 田字格</div>
      <div class="app-actions">
        <button class="button quiet install-button" id="installBtn" type="button" hidden>安装</button>
        <button class="button quiet mobile-settings" id="settingsBtn" type="button" aria-controls="controls" aria-expanded="false">设置</button>
        <button class="button primary export-button" id="exportPdfBtn" type="button">导出 PDF</button>
        <button class="button secondary" id="printBtn" type="button">打印</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="controls" id="controls" aria-label="练习本设置">
        <div class="drawer-head">
          <div>
            <strong>练习本设置</strong>
            <span id="saveStatus">已自动保存</span>
          </div>
          <button class="icon-button" id="closeSettingsBtn" type="button" aria-label="关闭设置">×</button>
        </div>

        <section class="control-section space-y-4">
          <div class="section-heading">
            <h2>内容</h2>
            <span id="contentStatus">准备就绪</span>
          </div>
          <div class="field flex flex-col gap-1.5">
            <span>内置内容</span>
            <select id="contentCategory" aria-label="内容分类"></select>
          </div>
          <div class="field flex flex-col gap-1.5">
            <div class="inline-action grid grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-2">
              <select id="contentTemplate" aria-label="内容模板"></select>
              <button class="button secondary content-action-btn" id="replaceContentBtn" type="button">替换</button>
              <button class="button secondary content-action-btn" id="appendContentBtn" type="button">追加</button>
            </div>
          </div>
          <label class="field flex flex-col gap-1.5">
            <span>练习文字</span>
            <textarea id="inputText" data-setting="inputText" rows="5" spellcheck="false"></textarea>
          </label>
          <div class="check-grid content-options grid grid-cols-2 gap-x-3">
            <label class="check"><input id="dedupe" data-setting="dedupe" type="checkbox"> <span>自动去重</span></label>
            <label class="check"><input id="showPinyin" data-setting="showPinyin" type="checkbox"> <span>显示拼音</span></label>
          </div>
        </section>

        <section class="control-section space-y-4">
          <h2>模板</h2>
          <div class="segmented template-segmented" role="radiogroup" aria-label="练习模板">
            <label><input data-setting="template" type="radio" name="template" value="trace"> <span>描红练习</span></label>
            <label><input data-setting="template" type="radio" name="template" value="stroke"> <span>笔顺分解</span></label>
            <label><input data-setting="template" type="radio" name="template" value="blank"> <span>空白格纸</span></label>
            <label><input data-setting="template" type="radio" name="template" value="copy"> <span>文章临摹</span></label>
          </div>
        </section>

        <section class="control-section space-y-4">
          <h2>纸张</h2>
          <div class="field space-y-1.5">
            <span>纸张尺寸</span>
            <div class="segmented paper-size-segmented" role="radiogroup" aria-label="纸张尺寸">
              <label><input data-setting="paperSize" type="radio" name="paperSize" value="A5"> <span>A5</span></label>
              <label><input data-setting="paperSize" type="radio" name="paperSize" value="A4"> <span>A4</span></label>
              <label><input data-setting="paperSize" type="radio" name="paperSize" value="A3"> <span>A3</span></label>
              <label><input data-setting="paperSize" type="radio" name="paperSize" value="Letter"> <span>Letter</span></label>
            </div>
          </div>
          <div class="field flex flex-col gap-1.5">
            <div class="flex items-end justify-between gap-3">
              <label for="marginMm">页边距（mm）</label>
              <span class="text-sm" style="color:var(--secondary)">页面方向</span>
            </div>
            <div class="flex items-end gap-3">
              <div class="stepper flex-1" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减小页边距">−</button>
                <input id="marginMm" class="stepper-input" data-setting="marginMm" type="number" min="6" max="24" step="1">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增大页边距">+</button>
              </div>
              <div class="segmented orientation-segmented" role="radiogroup" aria-label="页面方向">
                <label><input data-setting="orientation" type="radio" name="orientation" value="portrait"> <span><i class="orientation-icon portrait-icon" aria-hidden="true"></i>纵向</span></label>
                <label><input data-setting="orientation" type="radio" name="orientation" value="landscape"> <span><i class="orientation-icon landscape-icon" aria-hidden="true"></i>横向</span></label>
              </div>
            </div>
          </div>
        </section>

        <section class="control-section space-y-4">
          <h2>格子</h2>
          <div class="field space-y-1.5">
            <span>格子样式</span>
            <div class="segmented grid-style-segmented" role="radiogroup" aria-label="格子样式">
              <label><input data-setting="gridStyle" type="radio" name="gridStyle" value="tian"> <span>田字格</span></label>
              <label><input data-setting="gridStyle" type="radio" name="gridStyle" value="mi"> <span>米字格</span></label>
            </div>
          </div>
          <div class="field-grid grid grid-cols-2 items-end gap-x-3">
            <div class="field flex flex-col gap-1.5">
              <label for="cellSizeMm">格子大小（mm）</label>
              <div class="stepper" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减小格子">−</button>
                <input id="cellSizeMm" class="stepper-input" data-setting="cellSizeMm" type="number" min="8" max="32" step="1">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增大格子">+</button>
              </div>
            </div>
            <div class="field flex flex-col gap-1.5">
              <label for="cellGapMm">水平间距（mm）</label>
              <div class="stepper" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减小水平间距">−</button>
                <input id="cellGapMm" class="stepper-input" data-setting="cellGapMm" type="number" min="0" max="12" step="0.5">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增大水平间距">+</button>
              </div>
            </div>
            <div class="field flex flex-col gap-1.5">
              <label for="rowGapMm">行间距（mm）</label>
              <div class="stepper" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减小行间距">−</button>
                <input id="rowGapMm" class="stepper-input" data-setting="rowGapMm" type="number" min="0" max="16" step="0.5">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增大行间距">+</button>
              </div>
            </div>
          </div>
          <div class="grid-color-grid">
            <label class="field color-field flex flex-col gap-1.5">
              <span>外框</span>
              <input id="gridFrameColor" data-setting="gridFrameColor" type="color">
            </label>
            <label class="field color-field flex flex-col gap-1.5">
              <span>中间十字</span>
              <input id="gridCrossColor" data-setting="gridCrossColor" type="color">
            </label>
            <label class="field color-field flex flex-col gap-1.5">
              <span>对角线</span>
              <input id="gridDiagonalColor" data-setting="gridDiagonalColor" type="color">
            </label>
          </div>
          <label class="field color-field flex flex-col gap-1.5 stroke-only-color">
            <span>当前笔画</span>
            <input id="strokeActiveColor" data-setting="strokeActiveColor" type="color">
          </label>
          <label class="field color-field flex flex-col gap-1.5 guide-only-color">
            <span>范字颜色</span>
            <input id="guideColor" data-setting="guideColor" type="color">
          </label>
          <div class="field-grid blank-layout-settings grid grid-cols-2 items-end gap-x-3">
            <div class="field flex flex-col gap-1.5">
              <label for="cellsPerRow">每行格数（0 自动）</label>
              <div class="stepper" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减少每行格数">−</button>
                <input id="cellsPerRow" class="stepper-input" data-setting="cellsPerRow" type="number" min="0" max="24" step="1">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增加每行格数">+</button>
              </div>
            </div>
            <div class="field flex flex-col gap-1.5">
              <label for="rowsPerPage">每页行数（0 自动）</label>
              <div class="stepper" data-stepper>
                <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减少每页行数">−</button>
                <input id="rowsPerPage" class="stepper-input" data-setting="rowsPerPage" type="number" min="0" max="30" step="1">
                <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增加每页行数">+</button>
              </div>
            </div>
          </div>
          <div class="field blank-only gap-1.5">
            <label for="blankPageCount">空白纸页数</label>
            <div class="stepper" data-stepper>
              <button class="stepper-button" type="button" data-stepper-action="decrement" aria-label="减少空白纸页数">−</button>
              <input id="blankPageCount" class="stepper-input" data-setting="blankPageCount" type="number" min="1" max="12" step="1">
              <button class="stepper-button" type="button" data-stepper-action="increment" aria-label="增加空白纸页数">+</button>
            </div>
          </div>
        </section>

        <section class="control-section practice-settings space-y-4">
          <h2>练习</h2>
          <div class="field standard-only space-y-1.5">
            <span>每字占用行数</span>
            <div class="segmented rows-segmented" role="radiogroup" aria-label="每字占用行数">
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="1" min="1" max="6"> <span>1</span></label>
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="2" min="1" max="6"> <span>2</span></label>
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="3" min="1" max="6"> <span>3</span></label>
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="4" min="1" max="6"> <span>4</span></label>
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="5" min="1" max="6"> <span>5</span></label>
              <label><input data-setting="rowsPerCharacter" type="radio" name="rowsPerCharacter" value="6" min="1" max="6"> <span>6</span></label>
            </div>
          </div>
          <div class="field standard-only space-y-1.5">
            <span>描红模式</span>
            <div class="segmented trace-mode-segmented" role="radiogroup" aria-label="描红模式">
              <label><input data-setting="traceMode" type="radio" name="traceMode" value="full"> <span>完整字后留白</span></label>
              <label><input data-setting="traceMode" type="radio" name="traceMode" value="progressive"> <span>按笔顺累加</span></label>
              <label><input data-setting="traceMode" type="radio" name="traceMode" value="progressive-blank"> <span>累加后留白</span></label>
            </div>
          </div>
          <div class="check-grid stroke-options grid grid-cols-2 gap-x-3">
            <label class="check standard-only"><input id="showRowGuide" data-setting="showRowGuide" type="checkbox"> <span>格外引导字</span></label>
            <label class="check"><input id="showStrokeNumbers" data-setting="showStrokeNumbers" type="checkbox"> <span>笔顺编号</span></label>
            <label class="check"><input id="showStartDots" data-setting="showStartDots" type="checkbox"> <span>起笔点</span></label>
            <label class="check"><input id="showArrows" data-setting="showArrows" type="checkbox"> <span>方向箭头</span></label>
            <label class="check"><input id="showGuides" data-setting="showGuides" type="checkbox"> <span>辅助线</span></label>
          </div>
        </section>

        <section class="control-section trace-style space-y-4">
          <h2>描红样式</h2>
          <div class="grid grid-cols-2 gap-x-3">
            <label class="field color-field flex flex-col gap-1.5">
              <span>描红颜色</span>
              <input id="traceColor" data-setting="traceColor" type="color">
            </label>
            <label class="field flex flex-col gap-1.5">
              <span class="range-label">描红透明度 <output id="traceOpacityOutput"></output></span>
              <input id="traceOpacity" data-setting="traceOpacity" type="range" min="0.1" max="1" step="0.01">
            </label>
          </div>
          <label class="field flex flex-col gap-1.5">
            <span class="range-label">描红字大小 <output id="traceScaleOutput"></output></span>
            <input id="traceScale" data-setting="traceScale" type="range" min="0.5" max="1" step="0.05">
          </label>
        </section>

        <section class="control-section space-y-4">
          <h2>页眉与页脚</h2>
          <div class="field space-y-1.5">
            <span>页眉样式</span>
            <div class="segmented header-preset-segmented" role="radiogroup" aria-label="页眉样式">
              <label><input data-setting="headerPreset" type="radio" name="headerPreset" value="blank"> <span>无</span></label>
              <label><input data-setting="headerPreset" type="radio" name="headerPreset" value="simple"> <span>简洁</span></label>
              <label><input data-setting="headerPreset" type="radio" name="headerPreset" value="homework"> <span>作业</span></label>
              <label><input data-setting="headerPreset" type="radio" name="headerPreset" value="class"> <span>班级</span></label>
              <label><input data-setting="headerPreset" type="radio" name="headerPreset" value="teacher"> <span>教师</span></label>
            </div>
          </div>
          <div class="field space-y-1.5">
            <span>页脚样式</span>
            <div class="segmented footer-preset-segmented" role="radiogroup" aria-label="页脚样式">
              <label><input data-setting="footerPreset" type="radio" name="footerPreset" value="none"> <span>无页脚</span></label>
              <label><input data-setting="footerPreset" type="radio" name="footerPreset" value="right"> <span>右下页码</span></label>
              <label><input data-setting="footerPreset" type="radio" name="footerPreset" value="center"> <span>居中页码</span></label>
            </div>
          </div>
          <label class="field header-field flex flex-col gap-1.5" data-header-field="title">
            <span>标题</span>
            <input id="title" data-setting="title" type="text" maxlength="30">
          </label>
          <div class="field-grid grid grid-cols-2 items-end gap-x-3">
            <label class="field header-field flex flex-col gap-1.5" data-header-field="className">
              <span>班级</span>
              <input id="className" data-setting="className" type="text" maxlength="20">
            </label>
            <label class="field header-field flex flex-col gap-1.5" data-header-field="studentName">
              <span>姓名</span>
              <input id="studentName" data-setting="studentName" type="text" maxlength="20">
            </label>
          </div>
          <label class="field header-field flex flex-col gap-1.5" data-header-field="date">
            <span>日期</span>
            <input id="date" data-setting="date" type="date">
          </label>
        </section>

        <section class="control-section panel-actions grid grid-cols-2 gap-2">
          <button class="button secondary" id="resetBtn" type="button">恢复默认</button>
          <button class="button quiet" id="clearBtn" type="button">清空内容</button>
        </section>
      </aside>

      <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭设置" tabindex="-1"></button>

      <section class="preview-wrap" aria-label="纸张预览">
        <div class="preview-toolbar">
          <div class="summary-group">
            <strong id="summary">正在生成预览</strong>
            <span id="dataStatus" role="status" aria-live="polite">本地数据</span>
          </div>
          <label class="zoom-control">
            <span>缩放</span>
            <input id="zoom" data-setting="zoom" type="range" min="35" max="200" step="5">
            <output id="zoomOutput">70%</output>
            <button class="button quiet zoom-reset" id="zoomReset" type="button" aria-label="重置缩放到 100%" title="重置到 100%">⟲</button>
          </label>
        </div>
        <div id="pages" class="pages" aria-live="polite"></div>
      </section>
    </main>

    <div class="print-note" id="printNote" hidden>
      打印时请选择与预览一致的纸张，并使用“实际大小 / 100%”，关闭浏览器页眉页脚。
    </div>

    <div class="export-status" id="exportStatus" role="status" aria-live="polite" hidden></div>

    <script src="data/content-templates.js"></script>
    <script src="data/strokes.js"></script>
    <script src="data/stroke-index.js"></script>
    <script src="data/pinyin.js"></script>
    <script src="app.js"></script>

    <!-- ===== 咖啡杯打赏组件 ===== -->
    <div id="coffee-widget">
      <div class="close-btn" title="关闭">×</div>
      <div class="coffee-cup">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
          <path d="M6 1v3M10 1v3M14 1v3" />
        </svg>
      </div>
      <div class="qr-popup">
        <div class="qr-row">
          <div class="qr-item">
            <img src="icons/wechat-qr5.png" alt="微信赞赏码" />
            <span class="qr-label">赞赏支持</span>
          </div>
          <div class="qr-item">
            <img src="icons/wechat-qr6.png" alt="微信公众号" />
            <span class="qr-label">关注公众号</span>
          </div>
        </div>
      </div>
      <div class="bmc-text">Buy me a coffee</div>
    </div>
    <style>
      #coffee-widget {
        position: fixed;
        right: max(16px, 4vw);
        top: auto;
        bottom: max(120px, 22vh);
        z-index: 9999;
        cursor: grab;
        user-select: none;
        touch-action: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #coffee-widget:active { cursor: grabbing; }
      .coffee-cup {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #FFDD00 0%, #FFC107 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        color: #5d4037;
        position: relative;
        animation: cupFloat 3s ease-in-out infinite;
      }
      .coffee-cup::before,
      .coffee-cup::after {
        content: '';
        position: absolute;
        top: 6px;
        width: 3px;
        height: 10px;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 50%;
        opacity: 0;
        filter: blur(2px);
        pointer-events: none;
      }
      .coffee-cup::before {
        left: 34%;
        animation: steamRise 2.5s ease-out infinite;
      }
      .coffee-cup::after {
        left: 62%;
        animation: steamRise 2.5s ease-out 1.25s infinite;
      }
      .coffee-cup:hover {
        animation-play-state: paused;
        transform: scale(1.15) rotate(-5deg);
        box-shadow: 0 6px 20px rgba(255, 193, 7, 0.5);
      }
      .qr-popup {
        position: absolute;
        left: 50%;
        transform: translateX(-50%) translateY(10px) scale(0.8);
        opacity: 0;
        visibility: hidden;
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }
      .qr-row {
        display: flex;
        gap: 12px;
        align-items: center;
        background: white;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      }
      .qr-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .qr-item img {
        border-radius: 8px;
        object-fit: contain;
        max-height: 180px;
        width: auto;
      }
      .qr-label {
        font-size: 12px;
        color: #666;
        white-space: nowrap;
      }
      #coffee-widget:hover .qr-popup {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
        visibility: visible;
      }
      .close-btn {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        background: #ff4444;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 10000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #coffee-widget:hover .close-btn { opacity: 1; }
      .close-btn:hover {
        background: #cc0000;
        transform: scale(1.1);
      }
      @keyframes cupFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        33% { transform: translateY(-5px) rotate(1.5deg); }
        66% { transform: translateY(-3px) rotate(-1deg); }
      }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(0) translateX(0) scaleY(0.6) scaleX(1) rotate(0deg); }
        12% { opacity: 0.85; transform: translateY(-6px) translateX(3px) scaleY(1.2) scaleX(0.9) rotate(3deg); }
        35% { opacity: 0.6; transform: translateY(-16px) translateX(-4px) scaleY(2) scaleX(0.7) rotate(-5deg); }
        60% { opacity: 0.3; transform: translateY(-28px) translateX(5px) scaleY(2.8) scaleX(0.55) rotate(4deg); }
        100% { opacity: 0; transform: translateY(-42px) translateX(-2px) scaleY(3.5) scaleX(0.45) rotate(-2deg); }
      }
      .bmc-text {
        margin-top: 10px;
        font-size: 11px;
        color: #fff;
        background: #0099ff;
        white-space: nowrap;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 0.3px;
        transition: all 0.2s;
      }
      @media (max-width: 768px) {
        #coffee-widget {
          right: 12px;
          bottom: max(80px, 15vh);
        }
        .coffee-cup {
          width: 48px;
          height: 48px;
        }
        .qr-item img {
          max-height: 140px;
        }
      }
      #coffee-widget:hover .bmc-text {
        background: #007acc;
        transform: scale(1.05);
      }
    </style>
    <script>
      (function() {
        var widget = document.getElementById('coffee-widget');
        var isDragging = false;
        var hasMoved = false;
        var startX, startY, initialLeft, initialTop;
        var hideTimer = null;

        function getCurrentPos() {
          var rect = widget.getBoundingClientRect();
          return { left: rect.left, top: rect.top };
        }

        function resetToDefault() {
          widget.style.left = '';
          widget.style.top = '';
          widget.style.right = '';
          widget.style.bottom = '';
          widget.style.display = '';
        }

        function startDrag(clientX, clientY) {
          isDragging = true;
          hasMoved = false;
          var pos = getCurrentPos();
          startX = clientX;
          startY = clientY;
          initialLeft = pos.left;
          initialTop = pos.top;
          widget.style.left = initialLeft + 'px';
          widget.style.top = initialTop + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
          widget.style.cursor = 'grabbing';
        }

        function moveDrag(clientX, clientY) {
          if (!isDragging) return;
          var dx = clientX - startX;
          var dy = clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
          var newLeft = initialLeft + dx;
          var newTop = initialTop + dy;
          widget.style.left = newLeft + 'px';
          widget.style.top = newTop + 'px';
          var rect = widget.getBoundingClientRect();
          if (rect.left < 0) widget.style.left = '0px';
          if (rect.top < 0) widget.style.top = '0px';
          if (rect.right > window.innerWidth) widget.style.left = (window.innerWidth - rect.width) + 'px';
          if (rect.bottom > window.innerHeight) widget.style.top = (window.innerHeight - rect.height) + 'px';
        }

        function endDrag() {
          if (!isDragging) return;
          isDragging = false;
          widget.style.cursor = 'grab';
          if (hasMoved) {
            setTimeout(adjustPopupDirection, 50);
          }
        }

        function adjustPopupDirection() {
          var rect = widget.getBoundingClientRect();
          var popup = widget.querySelector('.qr-popup');
          var centerY = rect.top + rect.height / 2;
          var screenMid = window.innerHeight / 2;
          if (centerY < screenMid) {
            popup.style.bottom = 'auto';
            popup.style.top = '70px';
          } else {
            popup.style.top = 'auto';
            popup.style.bottom = '70px';
          }
        }

        function closeWidget() {
          widget.style.display = 'none';
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function() {
            widget.style.display = 'flex';
            resetToDefault();
            adjustPopupDirection();
          }, 60000);
        }

        widget.addEventListener('mousedown', function(e) {
          if (e.button !== 0) return;
          if (e.target.closest('.close-btn')) return;
          e.preventDefault();
          startDrag(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', function(e) {
          moveDrag(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', endDrag);

        widget.addEventListener('touchstart', function(e) {
          if (e.target.closest('.close-btn')) return;
          var touch = e.touches[0];
          startDrag(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (!isDragging) return;
          e.preventDefault();
          var touch = e.touches[0];
          moveDrag(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchend', endDrag);

        var closeBtn = widget.querySelector('.close-btn');
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeWidget();
          });
        }

        window.addEventListener('resize', function() {
          if (!isDragging && widget.style.display !== 'none') {
            adjustPopupDirection();
          }
        });

        resetToDefault();
        adjustPopupDirection();
      })();
    </script>
    <!-- ===== 咖啡杯打赏组件结束 ===== -->
  </body>
